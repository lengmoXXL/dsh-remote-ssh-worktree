name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range the manifests declare, one LTS at each end.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The crate is the whole of `agent/`; there is no root manifest.
          workspaces: agent
      - run: npm ci
      - run: npm run typecheck
      # The e2e suite drives the real binary, so build it before testing. The
      # test run builds the plugin itself through its `pretest` script.
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Test
        run: |
          export DSH_REMOTE_AGENT_BIN="$PWD/agent/target/release/dsh-remote-agent"
          npm test
      - name: Built artifacts exist
        run: |
          test -f packages/remote-workspace/lib/index.js
          test -f packages/remote-workspace/lib/index.d.ts
          test -f packages/remote-workspace/lib/client.js

  rust:
    strategy:
      fail-fast: false
      matrix:
        # The Rust half behaves differently on the two platforms this plugin
        # reaches: PTY allocation, foreground groups, and the `/proc` evidence
        # behind `term.inspectForeground` are per-OS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo fmt --manifest-path agent/Cargo.toml -- --check
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml
      # The Linux release assets are musl static builds, and musl types the
      # `ioctl` request differently from glibc, so type-check that target here
      # rather than discovering it when a release is already tagged.
      - if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo check --manifest-path agent/Cargo.toml --target x86_64-unknown-linux-musl --all-targets
          cargo check --manifest-path agent/Cargo.toml --target aarch64-unknown-linux-musl --all-targets
