name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range the manifests declare, one LTS at each end.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The bundle and built-daemon suites read `client/client.cjs` and
      # `agent/lib/main.mjs`, which are build outputs and not committed. A
      # fresh checkout has neither, so the build has to precede them.
      - run: npm run build
      - name: Built artifacts exist
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          test -f client/client.cjs
          test -f agent/lib/main.mjs
      - run: npm run test:all
