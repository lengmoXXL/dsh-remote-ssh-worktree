name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range the manifests declare, one LTS at each end.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built artifacts exist
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          test -f lib/client.js
      # The e2e suite drives the real binary, so build it before testing.
      - run: cargo build --release -p dsh-remote-agent
      - name: Test
        run: |
          export DSH_REMOTE_AGENT_BIN="$PWD/target/release/dsh-remote-agent"
          npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
