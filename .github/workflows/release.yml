name: Release

on:
  push:
    tags: ['v*']
  # Dispatch on the tag ref itself; a branch run fails the guard.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The plugin builds download URLs from the tag and the Cargo.toml version,
  # so a tag that disagrees with the build identity must never produce assets.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches agent/Cargo.toml version
        run: |
          version=$(grep -m1 '^version' agent/Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "agent/Cargo.toml has no version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$version from agent/Cargo.toml" >&2
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: dsh-remote-agent-linux-x86_64
            os: ubuntu-latest
            builder: cross
          - target: aarch64-unknown-linux-musl
            asset: dsh-remote-agent-linux-aarch64
            os: ubuntu-latest
            builder: cross
          - target: x86_64-apple-darwin
            asset: dsh-remote-agent-darwin-x86_64
            os: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            asset: dsh-remote-agent-darwin-aarch64
            os: macos-latest
            builder: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: agent
      # cross supplies the musl toolchain and links statically by default.
      - if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      # Built from inside the crate: there is no root manifest, and cross mounts
      # the directory it runs in as the workspace.
      - name: Build
        working-directory: agent
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }}
      # One Linux binary must run everywhere, so a dynamic build is a failure.
      - name: Verify static linking
        if: contains(matrix.target, 'musl')
        run: |
          bin=agent/target/${{ matrix.target }}/release/dsh-remote-agent
          file "$bin"
          # musl may be plain static or static-pie; dynamic is the failure.
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
      - run: cp agent/target/${{ matrix.target }}/release/dsh-remote-agent ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum dsh-remote-agent-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/dsh-remote-agent-* dist/SHA256SUMS \
            --repo lengmoXXL/dsh-remote-workspace \
            --verify-tag --generate-notes
